# Render Blueprint -- https://render.com/docs/blueprint-spec
# Deploy: push this repo, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at this repo. Render reads this file.
services:
  - type: web
    name: stats-and-more
    runtime: python
    plan: free
    # Build and run from the repo root. The default start command `uvicorn
    # main:app` resolves the root main.py, which re-exports Backend/app.py. No
    # migrate step: the run log is a stdlib-sqlite3 file created on first write,
    # and the free tier has no persistent disk anyway -- rows written at runtime
    # don't survive the next deploy, which is why the log is a local-only tool
    # and nothing on the live site depends on it.
    # Two toolchains, one build. Render's native build image ships node/npm
    # alongside python regardless of the runtime chosen, so the frontend is
    # built from source here rather than committed to git -- there is no
    # generated bundle in the repo that could silently go stale against the
    # source it came from.
    #
    # `npm ci` (not `npm install`) so the deploy resolves the exact tree in
    # package-lock.json. The frontend build runs first: if it fails, the deploy
    # fails before touching Python, and the previous version stays live.
    #
    # NO GIT LFS STEP, deliberately. Data/nhanes_analytic.csv (the 17 MB raw
    # NHANES merge) is tracked in LFS, and this build never fetches it: the app
    # reads Data/nhanes_adolescent.csv, the ~100 KB derived cohort, which is an
    # ordinary tracked file. So a checkout where the LFS object is still a
    # pointer stub boots correctly, and the cold start does not spend seconds
    # parsing 412 columns it will not use. Rebuilding the cohort from the raw
    # merge is a local task (`python Backend/engine.py build-cohort`), and CI verifies the
    # committed result still matches the code that derives it.
    buildCommand: >-
      cd frontend && npm ci && npm run build && cd ..
      && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # Render probes this for zero-downtime deploys; app.py returns 200 here.
    healthCheckPath: /healthz
    envVars:
      # Match the version pinned in .python-version / pyproject.toml (>=3.14.6).
      - key: PYTHON_VERSION
        value: 3.14.6
      # Pinned because the build image's default Node is unspecified and could
      # move under us. Vite 8 requires ^20.19 || >=22.12; 24 is the current LTS.
      - key: NODE_VERSION
        value: "24"
      - key: PYTHONUNBUFFERED
        value: "1"
