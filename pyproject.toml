[project]
name = "stats-and-more"
version = "4.1.0"
description = "Descriptive statistics with a minimal FastAPI web service"
readme = "README.md"
requires-python = ">=3.14.6"
dependencies = [
    "fastapi==0.139.0",
    "jinja2>=3.1.6",
    "lightgbm>=4.7.0",
    "numpy==2.5.1",
    "pandas>=3.0.3",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
    "uvicorn[standard]==0.51.0",
    "websockets==16.1",
]

# Vercel's FastAPI builder scans main.py for a literal top-level `app = ...`
# and does not follow the import there, so the entrypoint is declared here.
# Same app object as `uvicorn main:app` (Render) -- see main.py.
[tool.vercel]
entrypoint = "Backend.app:app"

[dependency-groups]
# Tooling and type stubs: needed to develop and test the project, never to run
# it. Keeping them out of [project.dependencies] means `uv sync --no-dev` (and
# anything else installing only runtime deps) gets the lean set the server needs.
dev = [
    "ipykernel>=7.3.0",
    # Only engine.figure_production() (a local CLI helper, no route) draws
    # with it, so it stays out of the runtime set every deploy installs.
    "matplotlib>=3.11.0",
    "pandas-stubs>=3.0.3.260530",
    "pytest>=8.0.0",
    "ruff==0.15.21",
    "scipy-stubs==1.18.0.1",
]

[tool.pytest.ini_options]
# Tests import the analysis modules directly (`from engine import ...`, `import study`);
# Backend/ isn't an installed package, so put it on the path rather than sprinkling
# sys.path hacks.
pythonpath = ["Backend"]
testpaths = ["tests"]

[tool.pylint.main]
# Same reason as pytest's pythonpath above: Backend/ is a plain directory, not an
# installed package, so the editor's linter needs it on sys.path or every
# `import engine` / `import cohort` in tests/ reads as an unresolved import.
init-hook = 'import sys; sys.path.insert(0, "Backend")'

